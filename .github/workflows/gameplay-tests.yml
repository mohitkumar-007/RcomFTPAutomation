name: Gameplay Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

env:
  FLUTTER_VERSION: '3.41.6'
  PATROL_CLI_VERSION: '4.5.1'
  PRISM_BRANCH: 'game_table_fixes'

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout RcomFTPAutomation
        uses: actions/checkout@v4
        with:
          path: RcomFTPAutomation

      - name: Setup SSH for Bitbucket
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BITBUCKET_SSH_KEY }}" > ~/.ssh/bitbucket_rsa
          chmod 600 ~/.ssh/bitbucket_rsa
          ssh-keyscan -t rsa bitbucket.org >> ~/.ssh/known_hosts 2>/dev/null

      - name: Clone Prism (Bitbucket)
        run: |
          git clone --depth 1 --branch "$PRISM_BRANCH" \
            git@bitbucket.org:junglee_games/prism.git prism
          echo "Cloned prism @ $(git -C prism rev-parse --short HEAD) ($PRISM_BRANCH)"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Rummy dependencies
        run: |
          cd prism/apps/rummy
          flutter pub get

      - name: Run tests on physical device
        run: |
          cd RcomFTPAutomation
          ./run_test.sh integration_test/main_test.dart 14091JEC202977 || true

      - name: Archive test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-test-results-${{ github.run_number }}
          path: |
            RcomFTPAutomation/reports/logcat_*.txt
            RcomFTPAutomation/reports/allure-results/
          retention-days: 30
          if-no-files-found: warn
