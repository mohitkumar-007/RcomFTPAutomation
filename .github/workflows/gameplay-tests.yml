name: Gameplay Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

env:
  FLUTTER_VERSION: '3.41.6'
  PATROL_CLI_VERSION: '4.5.1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hours max for the full suite + emulator startup

    steps:
      # 1. Checkout RcomFTPAutomation (this test suite repo)
      - name: Checkout RcomFTPAutomation
        uses: actions/checkout@v4
        with:
          path: RcomFTPAutomation

      # 2. Checkout Prism (the app being tested — separate repo, same owner)
      - name: Checkout Prism
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/prism
          path: prism
          # If Prism is private and this token can't see it, add a PAT:
          # token: ${{ secrets.PRISM_REPO_TOKEN }}

      # 3. Set up Java (required by Android SDK)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Set up Flutter at the exact pinned version (replaces FVM in CI —
      #    flutter-action caches by version, no shell-script install needed)
      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # 5. Enable KVM so the emulator runs at hardware speed, not software
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 6. Install Patrol CLI
      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli ${{ env.PATROL_CLI_VERSION }}

      # 7. Get Rummy dependencies
      - name: Get Rummy dependencies
        run: |
          cd prism/apps/rummy
          flutter pub get

      # 8. Run the full gameplay suite on a managed Android emulator.
      #    reactivecircus/android-emulator-runner boots the AVD, runs the
      #    script inside that context, and tears it down after — this is
      #    the reliable way to get an emulator on a GitHub-hosted runner
      #    (manual avdmanager/emulator invocation is flaky without it).
      - name: Run gameplay suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            DEVICE_ID=$(adb devices | awk 'NR==2 {print $1}')
            cd RcomFTPAutomation
            RUMMY_DIR="${{ github.workspace }}/prism/apps/rummy" \
              ./run_suite.sh "$DEVICE_ID" --no-serve || true
            # `|| true`: a scenario failure (or the known 6P watchdog kill)
            # must not fail this step — the Allure report is the record of
            # truth; the job below decides pass/fail from its contents.

      # 9. Archive logcats + Allure results as a downloadable artifact
      - name: Archive test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-test-results-${{ github.run_number }}
          path: |
            RcomFTPAutomation/reports/logcat_*.txt
            RcomFTPAutomation/reports/allure-results/
          retention-days: 30
          if-no-files-found: warn
